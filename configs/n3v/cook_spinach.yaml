gaussian_dim: 4
time_duration: [0.0, 1.0]
num_pts: 300_000
num_pts_ratio: 1.0
rot_4d: True
force_sh_3d: False
batch_size: 4
target_ts_train: [0,300]
target_ts_test: [0,300]

ModelParams:
  sh_degree: 3
  source_path: "/path/to/data/n3v/sparse/cook_spinach"
  transforms_file: "sfm_transforms_extend.json"
  # transforms_file: ${.model_path}/pose/sfm_transforms_to_ours.json
  ply_file: "preprocess/time_0000/sparse/0/points3D.ply"
  camera_downsample: 2
  Ntime: 300

  experiment_name: "cook_spinach"
  model_path: "/path/to/outputs/n3v/cook_spinach"

  images: "images"
  resolution: 1
  white_background: False
  data_device: "cuda"
  eval: True
  extension: ".png"
  num_extra_pts: 0
  frame_ratio: 0.1
  dataloader: True

PipelineParams:
  convert_SHs_python: False
  compute_cov3D_python: False
  debug: False
  env_map_res: 0
  env_optimize_until: 5000
  env_optimize_from: 0
  eval_shfs_4d: True

OptimizationParams:
  iterations: 30_000
  position_lr_init: 0.00016
  position_t_lr_init: -1.0
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 30_000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  thresh_opa_prune: 0.005
  densification_interval: 100
  opacity_reset_interval: 30000
  densify_from_iter: 500
  densify_until_iter: 15_000
  densify_grad_t_threshold: 0.0002 / 40
  densify_grad_threshold: 0.0002
  densify_until_num_points: 4000000
  final_prune_from_iter: -1
  sh_increase_interval: 1000
  lambda_opa_mask: 0.0
  lambda_rigid: 0.0
  lambda_motion: 0.0

  lambda_lpips: 0.2
  lambda_depth: 1.0
  lambda_pose: 1.0
  cam_optim_from_iter: 1000
  cam_optim_until_iter: 7000
  camera_lr_max_steps: 7000

ModelHiddenParams:
  train_distortion: True
  distortion_optim_from_iter: 1000
  kplanes_config:
    grid_dimensions: 2
    input_coordinate_dim: 5
    output_coordinate_dim: 16
    resolution: [128, 128, 128, 301, 50]
  net_width: 128
  zero_canonical_weight: 1.0
  time_smoothness_weight: 0.0001
  l1_time_planes: 0.0001
  plane_tv_weight: 0.0002
  multires: [1,2]
  defor_depth: 0
  apply_film_modulate: True
